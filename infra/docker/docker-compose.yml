version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: assistant_postgres
    environment:
      POSTGRES_USER: assistant_user
      POSTGRES_PASSWORD: assistant_password
      POSTGRES_DB: assistant_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: assistant_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backend
    container_name: assistant_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://assistant_user:assistant_password@db:5432/assistant_db
      - REDIS_URL=redis://redis:6379/0
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-0}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: assistant_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
